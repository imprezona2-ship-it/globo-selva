<!DOCTYPE html>
<html lang="es">
<head>

<style>
:root{--ink:#2a1a0c;--air:#1fa8ff;--airD:#0b6fc0;--red:#ff4136;--redD:#b81d14;--sun:#ffd23f;--wood1:#8a5628;--wood2:#55300f}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#2d7a3a}
body{font-family:'Baloo 2',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:var(--ink);user-select:none;-webkit-user-select:none;touch-action:none}
button{font-family:inherit;color:inherit}
#cv{position:fixed;left:0;top:0;width:100%;height:100%;display:block}
#under{position:fixed;left:0;right:0;bottom:0;display:none;z-index:1;background:
 linear-gradient(#7bd23a 0,#7bd23a 10px,#2f6a10 10px,#2f6a10 14px,transparent 14px),
 repeating-linear-gradient(90deg,transparent 0,transparent 58px,#5a2c0c 58px,#5a2c0c 62px),
 repeating-linear-gradient(0deg,#e8912c 0,#e8912c 40px,#5a2c0c 40px,#5a2c0c 44px);border-top:4px solid #1c4a10}
body.port #under{display:block}
body.port .ctl{width:min(40vw,190px);height:min(22vw,100px);bottom:calc(26px + env(safe-area-inset-bottom));border-radius:26px}

/* ---------- HUD ---------- */
#hud{position:fixed;left:0;right:0;top:0;display:none;gap:8px;align-items:center;padding:calc(8px + env(safe-area-inset-top)) calc(10px + env(safe-area-inset-right)) 0 calc(10px + env(safe-area-inset-left));pointer-events:none;z-index:5}
#hud.show{display:flex}
.panel{display:flex;align-items:center;gap:6px;padding:3px 14px;border-radius:14px;border:3px solid #e0a82a;background:linear-gradient(#3a2412,#1c0f06);box-shadow:inset 0 2px 0 rgba(255,220,120,.25),0 3px 0 rgba(0,0,0,.4);color:#ffd23f;font-weight:800;font-size:clamp(17px,4.6vh,27px);text-shadow:0 2px 0 #000,0 0 6px rgba(255,200,60,.35);min-height:clamp(32px,8.6vh,46px)}
.panel.wood{border-color:#3a1f0a;background:linear-gradient(#a8692f,#6b3d17);box-shadow:inset 0 2px 0 rgba(255,225,170,.45),0 3px 0 rgba(0,0,0,.4)}
.panel .ic{font-size:.95em;filter:drop-shadow(0 2px 0 #2b180a)}

#pauseB{pointer-events:auto;width:clamp(36px,9.5vh,50px);height:clamp(36px,9.5vh,50px);border-radius:14px;border:3px solid #0a3a66;background:linear-gradient(#49b6ff,#1177d6);color:#fff;font-size:clamp(16px,4vh,22px);font-weight:800;box-shadow:inset 0 2px 0 rgba(255,255,255,.4),0 3px 0 rgba(0,0,0,.35);cursor:pointer}
.ctl{border-color:#aebccd!important;position:fixed;bottom:calc(14px + env(safe-area-inset-bottom));z-index:5;display:none;align-items:center;justify-content:center;gap:4px;width:clamp(78px,22vh,116px);height:clamp(54px,15vh,76px);border-radius:22px;border:3px solid #0a3a66;background:linear-gradient(#fff,#d8ecff);box-shadow:0 4px 0 rgba(0,0,0,.35);font-weight:800;font-size:clamp(20px,6vh,30px);overflow:hidden;cursor:pointer;touch-action:none}
.ctl.show{display:flex}
.ctl.left{left:calc(14px + env(safe-area-inset-left))}
.ctl.right{right:calc(14px + env(safe-area-inset-right));border-color:#7a0c18;background:linear-gradient(#fff,#ffdede)}
.ctl i{position:absolute;left:0;right:0;bottom:0;height:0;background:linear-gradient(#6fd0ff,#1fa8ff);opacity:.75}
.ctl span{position:relative}
.ctl:active{transform:translateY(2px)}
#rot{position:fixed;left:50%;top:38%;transform:translateX(-50%);background:rgba(20,40,20,.85);color:#fff;border-radius:18px;padding:12px 18px;font-weight:800;font-size:18px;text-align:center;z-index:30;display:none;pointer-events:none}
#rot.show{display:block}
/* ---------- OVERLAYS ---------- */
.btn{font-weight:800;font-size:18px;padding:10px 22px;border-radius:999px;border:3px solid var(--ink);background:#fff;box-shadow:0 4px 0 var(--ink);cursor:pointer}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.air{background:var(--air);color:#fff}
.btn.yell{background:var(--red);color:#fff}
.btn.green{background:#3fb23a;color:#fff}
.btn.small{font-size:14px;padding:6px 14px;box-shadow:none;border-width:2px}
.btn.big{font-size:26px;padding:10px 40px}
.ov{position:fixed;inset:0;background:rgba(20,30,15,.58);display:none;align-items:center;justify-content:center;z-index:20;padding:12px}
.ov.show{display:flex}
.modal{background:#fff9e6;border:4px solid var(--ink);border-radius:24px;box-shadow:0 8px 0 var(--ink);padding:16px 20px;width:min(100%,430px);max-height:96vh;overflow:auto;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.modal h2{font-size:clamp(24px,7vh,32px);line-height:1.05}
.modal .bigN{font-size:clamp(40px,12vh,58px);font-weight:800;color:#2f8f2a;line-height:1}
.modal p{font-size:15px;opacity:.8;line-height:1.25}
.modal .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.modal .emo{font-size:clamp(34px,10vh,52px);line-height:1}
.steps{text-align:left;font-size:15px;line-height:1.3;padding-left:24px;display:flex;flex-direction:column;gap:6px;align-self:stretch}
.how{display:flex;flex-direction:column;gap:6px;align-self:stretch}
.how div{display:flex;align-items:center;gap:10px;text-align:left;background:#fff;border:3px solid var(--ink);border-radius:14px;padding:5px 12px;font-weight:600;font-size:15px;line-height:1.15}
.how b{font-size:26px;width:34px;text-align:center}
.how em{font-style:normal;font-weight:800}
.sens{display:flex;gap:8px;align-items:center;font-weight:600;font-size:14px}
.sens input{width:140px}
.chk{display:flex;gap:8px;align-items:center;font-size:14px;font-weight:600}
</style>

<body>
<canvas id="cv"></canvas><div id="under"></div>

<div id="hud">
  <div class="panel wood hearts" id="hearts"></div>
  <div class="panel"><span class="ic">🏆</span><b id="hScore">0</b></div>
  <div class="panel"><span class="ic">👑</span><b id="hBest">0</b></div>
  <div class="spacer"></div>
  <div class="panel"><i class="coin"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="16.5" rx="5.4" ry="4.4"/><circle cx="5.6" cy="11.4" r="2.1"/><circle cx="9.6" cy="7.4" r="2.2"/><circle cx="14.4" cy="7.4" r="2.2"/><circle cx="18.4" cy="11.4" r="2.1"/></svg></i>× <b id="hCoins">0</b></div>
  <button id="pauseB">❚❚</button>
</div>
<div class="ctl left" id="blowB"><i id="blowFill"></i><span>💨⬆</span></div>
<div class="ctl right" id="shootB"><span><svg viewBox="0 0 24 24" width="1.3em" height="1.3em"><path d="M12 1l2.6 6.4L21 5l-3 6.2L23 14l-6.5 1.2L16 22l-4-5-4 5-.5-6.8L1 14l5-2.8L3 5l6.4 2.4z" fill="#ff3b2e" stroke="#8a0c08" stroke-width="1.2" stroke-linejoin="round"/></svg></span></div>
<div id="rot">📱↻ Girá el celu para jugar mejor<br><small>(tocá para cerrar)</small></div>

<!-- INICIO -->
<div class="ov show" id="start"><div class="modal">
  <div class="emo">🎈🌴</div>
  <h2>Globo Selva</h2>
  <div class="how" id="howS"></div>
  <p>Juntá monedas, esquivá las plantas y sus semillas. Tenés 3 corazones ❤️</p>
  <label class="sens">🎚️ Sensibilidad <input type="range" id="sensS" min="0.5" max="5" step="0.1"></label>
  <label class="chk"><input type="checkbox" id="touchT"> Jugar sin micrófono (con botones)</label>
  <button class="btn green big" id="playB">¡JUGAR!</button>
</div></div>

<!-- PAUSA -->
<div class="ov" id="pause"><div class="modal">
  <h2>Pausa ⏸️</h2>
  <div class="how" id="howP"></div>
  <label class="sens">🎚️ Sensibilidad <input type="range" id="sensP" min="0.5" max="5" step="0.1"></label>
  <div class="row"><button class="btn green" id="resumeB">Seguir ▶</button><button class="btn" id="restartB">Reiniciar</button></div>
</div></div>

<!-- PERMISO MIC -->
<div class="ov" id="gate" style="z-index:40"><div class="modal">
  <div class="emo" id="gIcon">🎤</div>
  <h2 id="gTitle">Necesito tu micrófono</h2>
  <p id="gText"></p>
  <ol class="steps" id="gSteps"></ol>
  <div class="row" id="gBtns">
    <button class="btn yell" id="gOk">Permitir micrófono</button>
    <button class="btn yell" id="gSettings">⚙️ Abrir configuración</button>
    <button class="btn air" id="gRetry">Ya lo permití ✅</button>
    <button class="btn" id="gTouch">Jugar con botones</button>
  </div>
  <div class="row"><button class="btn small" id="gReload">🔄 Recargar página</button><button class="btn small" id="gCancel">Cerrar</button></div>
</div></div>

<!-- FIN -->
<div class="ov" id="over"><div class="modal">
  <div class="emo">💥🎈</div>
  <h2 id="ovTitle">¡Se pinchó el globo!</h2>
  <div class="bigN" id="ovBig"></div>
  <p id="ovSub"></p>
  <div class="row"><button class="btn green" id="ovAgain">Otra vez</button><button class="btn" id="ovMenu">Inicio</button></div>
</div></div>

<script>
/* ================= utilidades ================= */
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const rand=(a,b)=>a+Math.random()*(b-a);
const store={
  get(k,d){try{const v=localStorage.getItem('sog_'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem('sog_'+k,JSON.stringify(v))}catch(e){}}
};
function vib(p){try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const settings={touch:store.get('touch',false)};

/* ================= MICRÓFONO: detecta soplido vs grito =================
   - Volumen (RMS) sobre el ruido ambiente calibrado.
   - Grito = sonido con tono (autocorrelación alta, espectro con picos).
   - Soplido = ruido sin tono (autocorrelación baja, espectro plano).        */
const Mic={
  ctx:null,an:null,ready:false,noise:0.004,sens:store.get('sens2',1.6),thr:0.01,
  rms:0,acorr:0,flat:0,intensity:0,pShout:0.35,hold:0,state:'silence',lastLoud:'blow',pend:0,active:false,
  async start(){
    if(this.ready)return;
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){const e=new Error('nomedia');e.name='NoMedia';throw e}
    const AC=window.AudioContext||window.webkitAudioContext;
    if(!this.ctx)this.ctx=new AC();
    const resumeP=this.ctx.resume?this.ctx.resume():Promise.resolve();
    const stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
    try{await resumeP}catch(e){}
    const src=this.ctx.createMediaStreamSource(stream);
    const hp=this.ctx.createBiquadFilter();hp.type='highpass';hp.frequency.value=70; // deja pasar más del soplido cercano
    const an=this.ctx.createAnalyser();an.fftSize=2048;an.smoothingTimeConstant=0.2;
    src.connect(hp);hp.connect(an);
    this.an=an;this.stream=stream;
    this.td=new Float32Array(2048);this.ds=new Float32Array(1024);this.fd=new Float32Array(1024);
    this.ready=true;
  },
  calibrate(ms=1200){
    return new Promise(res=>{
      const vals=[];const t0=performance.now();
      const iv=setInterval(()=>{
        this.measure();vals.push(this.rms);
        if(performance.now()-t0>ms){clearInterval(iv);vals.sort((a,b)=>a-b);
          this.noise=clamp(vals[Math.floor(vals.length*0.4)]||0.003,0.0015,0.04);res()}
      },30);
    });
  },
  measure(){
    const b=this.td;this.an.getFloatTimeDomainData(b);
    let s=0;for(let i=0;i<2048;i++)s+=b[i]*b[i];
    this.rms=Math.sqrt(s/2048);
    // autocorrelación normalizada sobre señal submuestreada x2
    const d=this.ds;for(let i=0;i<1024;i++)d[i]=(b[2*i]+b[2*i+1])*0.5;
    const sr=this.ctx.sampleRate/2;
    const minLag=Math.max(2,Math.floor(sr/1000)),maxLag=Math.min(Math.floor(sr/80),400);
    const M=1024-maxLag;
    let e0=0;for(let i=0;i<M;i++)e0+=d[i]*d[i];
    let eL=0;for(let i=1;i<=M;i++)eL+=d[i]*d[i];
    let dipped=false,best=0;
    for(let lag=1;lag<=maxLag;lag++){
      let c=0;for(let i=0;i<M;i++)c+=d[i]*d[i+lag];
      const r=c/(Math.sqrt(e0*eL)+1e-12);
      if(!dipped){if(r<0.25)dipped=true}
      else if(lag>=minLag&&r>best)best=r;
      if(lag<maxLag)eL+=d[lag+M]*d[lag+M]-d[lag]*d[lag];
    }
    this.acorr=best;
    // planitud espectral 200 Hz – 5 kHz
    this.an.getFloatFrequencyData(this.fd);
    const hz=this.ctx.sampleRate/2048,a=Math.floor(200/hz),z=Math.min(1023,Math.floor(5000/hz));
    let ls=0,ps=0,n=0;
    for(let k=a;k<=z;k++){const p=Math.pow(10,Math.max(this.fd[k],-140)/10);ls+=Math.log(p+1e-20);ps+=p;n++}
    this.flat=n?Math.exp(ls/n)/((ps/n)+1e-20):1;
  },
  update(dt){
    if(!this.ready){this.state='silence';this.intensity=0;return}
    this.measure();
    const hi=Math.max(0.003,this.noise*2.5)/this.sens;                 // umbral para empezar a detectar
    const thr=this.thr=this.hold>0?Math.max(hi*0.7,this.noise*1.5):hi; // una vez detectando, aguanta con menos (histéresis)
    this.active=this.rms>thr;   // hay sonido en este instante
    this.pend-=dt;
    if(this.rms>thr){
      if(this.hold<=0){this.pShout=0.5;this.lastLoud='blow';this.pend=0.05}   // sonido nuevo: 50 ms para decidir qué es
      this.hold=0.12;
      const voiced=this.acorr>0.72||(this.acorr>0.5&&this.flat<0.3);
      this.pShout+=((voiced?1:0)-this.pShout)*Math.min(1,dt*10);
      const inten=clamp(Math.log(this.rms/hi)/Math.log(4),0.15,1);
      this.intensity+=(inten-this.intensity)*Math.min(1,dt*15);
    }else{
      this.hold-=dt;
      if(this.hold<=0){this.intensity+=(0-this.intensity)*Math.min(1,dt*15);this.pShout+=(0.35-this.pShout)*Math.min(1,dt*6)}
    }
    if(this.hold>0){
      if(this.pShout>0.6)this.lastLoud='shout';else if(this.pShout<0.4)this.lastLoud='blow';
      this.state=this.pend>0?'silence':this.lastLoud;
    }else this.state='silence';
  }
};

/* ---------- permiso de micrófono ----------
   1) Al abrir, si todavía no hay permiso, aparece el cartel y el navegador pregunta.
   2) Si el permiso quedó bloqueado, explica paso a paso cómo habilitarlo en la configuración
      (y en la versión app, el botón "Abrir configuración" abre los ajustes de la app).
   3) Al volver de la configuración, reintenta solo.                                         */
const UA=navigator.userAgent;
const PLAT=/Android/i.test(UA)?'android':(/iPhone|iPad|iPod/i.test(UA)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1))?'ios':'pc';
const inApp=()=>!!(window.Android&&typeof window.Android.openSettings==='function');
const inFrame=(()=>{try{return window.self!==window.top}catch(e){return true}})();
let permState='prompt',permStatus=null,gateThen=null,gateForce=false,gateMode='';
const STEPS={
  android:['Tocá el candado 🔒 (o el ícono ⓘ) a la izquierda de la dirección.','Entrá a <b>Permisos</b> → <b>Micrófono</b> → <b>Permitir</b>.','Volvé acá y tocá <b>Ya lo permití</b>.','¿Sigue sin andar? Ajustes del celu → <b>Apps</b> → <b>Chrome</b> → <b>Permisos</b> → <b>Micrófono</b> → <b>Permitir</b>.'],
  ios:['Tocá <b>aA</b> en la barra de dirección de Safari.','Entrá a <b>Ajustes del sitio web</b> → <b>Micrófono</b> → <b>Permitir</b>.','Volvé y tocá <b>Ya lo permití</b>. Si no anda, recargá la página.'],
  pc:['Hacé clic en el candado 🔒 a la izquierda de la dirección.','Poné <b>Micrófono</b> en <b>Permitir</b>.','Tocá <b>Ya lo permití</b> o recargá la página.'],
  app:['Tocá <b>Abrir configuración</b>.','Entrá a <b>Permisos</b> → <b>Micrófono</b> → <b>Permitir</b>.','Volvé al juego: se activa solo.']
};
function renderGate(mode){
  gateMode=mode;
  const M={
    ask:['🎤','Activá el micrófono','Globo Selva se juega soplando 😄. Cuando aparezca el cartel, tocá "Permitir". El sonido no se graba ni se envía a ningún lado.'],
    working:['🎤','Esperando permiso…','Tocá "Permitir" en el cartel del navegador.'],
    calib:['🤫','Hacé silencio…','Mido el ruido del ambiente un segundito.'],
    denied:['🔒','El micrófono está bloqueado','Sin micrófono no se puede soplar. Habilitalo así:'],
    viewer:['🌐','Abrilo en el navegador','Desde esta vista previa no se puede usar el micrófono. Abrí el juego en Chrome (o desde un link https) y ahí te va a pedir permiso.'],
    insecure:['🌐','Necesita una página segura','El micrófono solo funciona en páginas https. Subí el juego a un link https (por ejemplo, Railway) y abrilo desde ahí.'],
    nomic:['😕','No encontré micrófono','Fijate que el micrófono no esté tapado ni lo esté usando otra app.']
  }[mode];
  $('#gIcon').textContent=M[0];$('#gTitle').textContent=M[1];$('#gText').textContent=M[2];
  const st=$('#gSteps');
  if(mode==='denied'){st.innerHTML=STEPS[inApp()?'app':PLAT].map(x=>'<li>'+x+'</li>').join('');st.style.display=''}
  else{st.innerHTML='';st.style.display='none'}
  const vis={gOk:mode==='ask',gSettings:mode==='denied'&&inApp(),gRetry:mode==='denied'||mode==='nomic',
    gTouch:!gateForce&&!['working','calib'].includes(mode),gCancel:!['working','calib'].includes(mode),gReload:mode==='denied'&&!inApp()};
  for(const id in vis)$('#'+id).style.display=vis[id]?'':'none';
  $('#gBtns').style.display=(vis.gOk||vis.gSettings||vis.gRetry||vis.gTouch)?'flex':'none';
}
const showGate=()=>$('#gate').classList.add('show');
const hideGate=()=>{$('#gate').classList.remove('show');gateMode=''};
async function activateMic(){
  renderGate('working');showGate();
  try{
    await Mic.start();
    permState='granted';
    renderGate('calib');
    await Mic.calibrate(1200);
    hideGate();
    const t=gateThen;gateThen=null;t&&t();
  }catch(e){handleMicError(e)}
}
function handleMicError(e){
  const n=e&&e.name;
  if(!window.isSecureContext&&!inApp()){renderGate(inFrame?'viewer':'insecure');return}
  if(n==='NotFoundError'||n==='DevicesNotFoundError'||n==='OverconstrainedError'||n==='NotReadableError'){renderGate('nomic');return}
  let st=permState;try{if(permStatus)st=permStatus.state}catch(_){}
  if(n==='NoMedia'){renderGate(inFrame?'viewer':'insecure');return}
  if(inFrame&&st!=='denied'&&!inApp()){renderGate('viewer');return}
  permState='denied';renderGate('denied');
}
function needMic(then,force){
  if(Mic.ready||(settings.touch&&!force)){then();return}
  gateThen=then;gateForce=!!force;
  if(permState==='granted'){activateMic();return}   // ya tenía permiso: arranca directo
  renderGate(permState==='denied'?'denied':'ask');showGate();
}
$('#gOk').onclick=()=>activateMic();
$('#gRetry').onclick=()=>activateMic();
$('#gSettings').onclick=()=>{try{window.Android.openSettings()}catch(e){}};
$('#gReload').onclick=()=>location.reload();
$('#gTouch').onclick=()=>{
  settings.touch=true;store.set('touch',true);$('#touchT').checked=true;try{fillHow()}catch(e){}
  hideGate();const t=gateThen;gateThen=null;t&&t();
};
$('#gCancel').onclick=()=>{hideGate();gateThen=null};

// Al volver de la configuración (o si el permiso cambia), reintenta solo
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState!=='visible'||gateMode!=='denied')return;
  let st='';try{st=permStatus?permStatus.state:''}catch(_){}
  if(st==='granted'||inApp()||!permStatus)activateMic();
});

// Al abrir: consulta el estado del permiso y, si falta, lo pide
(async()=>{
  try{
    if(navigator.permissions&&navigator.permissions.query){
      permStatus=await navigator.permissions.query({name:'microphone'});
      permState=permStatus.state;
      permStatus.onchange=()=>{permState=permStatus.state;if(permState==='granted'&&gateMode==='denied')activateMic()};
    }
  }catch(e){}
  if(false){
    gateThen=null;gateForce=false;
    renderGate(permState==='denied'?'denied':'ask');showGate();
  }
})();

  for(const[fx,len,ang,col] of [[0.0,0.3,-1.15,'#3fbf3f'],[0.03,0.26,-0.55,'#58d24a'],[0.07,0.2,-1.5,'#2a9a32'],[0.22,0.12,-1.3,'#58d24a'],[0.5,0.1,-1.6,'#3fbf3f'],[0.78,0.12,-1.4,'#58d24a'],[1.0,0.3,-2.0,'#3fbf3f'],[0.97,0.25,-2.6,'#58d24a'],[0.93,0.2,-1.65,'#2a9a32']])leaf(g,W*fx,H*1.01,H*len,ang,col,'#145a1a');
}
/* ---------- HUD y pantallas ---------- */
const hearts=$('#hearts'),hScore=$('#hScore'),hBest=$('#hBest'),hCoins=$('#hCoins'),blowFill=$('#blowFill');
const HEART='<svg viewBox="0 0 24 24"><path d="M12 21s-7-4.6-9.5-9C.8 8.4 3 4.5 6.8 4.5c2 0 3.5 1 5.2 3 1.7-2 3.2-3 5.2-3 3.8 0 6 3.9 4.3 7.5C19 16.4 12 21 12 21z"/></svg>';
let lastSc=-1,lastBest=-1;
const fmt=n=>n.toLocaleString('es-AR');
function hudInit(){
  hearts.innerHTML=[0,1,2].map(i=>'<span class="'+(i<S.lives?'':'off')+'">'+HEART+'</span>').join('');
  hearts.querySelectorAll('span').forEach(s=>s.style.display='flex');
  $('#hud').classList.add('show');
  const live=['ready','play','paused'].includes(S.state);
  $('#blowB').classList.toggle('show',live);$('#shootB').classList.toggle('show',live);
  hudCoins();lastSc=-1;lastBest=-1;hudScore();
}
function hudCoins(){hCoins.textContent=S.coins}
function hudScore(){if(S.score!==lastSc){lastSc=S.score;hScore.textContent=fmt(S.score)}const bb=Math.max(S.best,S.score);if(bb!==lastBest){lastBest=bb;hBest.textContent=fmt(bb)}}
const HOW=()=>settings.touch?
 '<div><b>💨</b><span><em>Mantené el botón azul</em> y el globo SUBE</span></div><div><b>⬇️</b><span><em>Soltalo</em> y el globo BAJA solo</span></div><div><b>💥</b><span><em>Botón rojo o tocá la pantalla</em>: DISPARA (rompe cajas, vence zombis y destruye las semillas)</span></div><div><b>⚠️</b><span>Las <em>plantas no se matan</em>: ¡esquivalas! Si caés al pozo, <em>mantené el botón azul</em> para subir</span></div>':
 '<div><b>💨</b><span><em>Soplá</em> cerca del micrófono y el globo SUBE</span></div><div><b>⬇️</b><span><em>Dejá de soplar</em> y el globo BAJA solo</span></div><div><b>👆</b><span><em>Tocá la pantalla</em>: DISPARA (rompe cajas, vence zombis y destruye las semillas)</span></div><div><b>⚠️</b><span>Las <em>plantas no se matan</em>: ¡esquivalas! Si caés al pozo, <em>soplá fuerte</em> para volver a subir</span></div>';
function fillHow(){$('#howS').innerHTML=HOW();$('#howP').innerHTML=HOW()}
function showOver(){
  const rec=S.score>0&&S.score>=S.best&&S.score===store.get('jsBest',0);
  $('#ovTitle').textContent=rec?'¡Nuevo récord! 🏆':'¡Se pinchó el globo!';$('#ovBig').textContent=fmt(S.score);
  $('#ovSub').textContent='Récord: '+fmt(S.best)+' · Monedas: '+S.coins;$('#over').classList.add('show');
}
function startGame(){$('#start').classList.remove('show');$('#over').classList.remove('show');$('#pause').classList.remove('show');S.shown=false;reset();resize()}
function pauseGame(){if(S.state!=='play'&&S.state!=='ready')return;S.prev=S.state;S.state='paused';fillHow();$('#pause').classList.add('show');hudInit()}
function resumeGame(){$('#pause').classList.remove('show');S.state=S.prev||'play';hudInit()}
function toMenu(){S.state='menu';$('#over').classList.remove('show');$('#pause').classList.remove('show');$('#hud').classList.remove('show');$('#blowB').classList.remove('show');$('#shootB').classList.remove('show');fillHow();$('#start').classList.add('show');reset();S.state='menu';$('#hud').classList.remove('show');$('#blowB').classList.remove('show');$('#shootB').classList.remove('show')}
$('#playB').onclick=()=>needMic(startGame);
$('#ovAgain').onclick=()=>{$('#over').classList.remove('show');S.shown=false;reset()};
$('#ovMenu').onclick=toMenu;
$('#pauseB').onclick=pauseGame;$('#resumeB').onclick=resumeGame;
$('#restartB').onclick=()=>{$('#pause').classList.remove('show');S.shown=false;reset()};
$('#touchT').checked=settings.touch;
$('#touchT').onchange=e=>{settings.touch=e.target.checked;store.set('touch',settings.touch);fillHow()};
const setSens=v=>{Mic.sens=parseFloat(v);store.set('sens2',Mic.sens);$('#sensS').value=Mic.sens;$('#sensP').value=Mic.sens};
$('#sensS').oninput=e=>setSens(e.target.value);$('#sensP').oninput=e=>setSens(e.target.value);setSens(Mic.sens);
// controles
cv.addEventListener('pointerdown',e=>{if(S.state==='play'||S.state==='ready')shootReq=true;e.preventDefault()});
$('#shootB').addEventListener('pointerdown',e=>{if(S.state==='play'||S.state==='ready')shootReq=true;e.preventDefault();e.stopPropagation()});
const bb=$('#blowB');
bb.addEventListener('pointerdown',e=>{touchLift=true;bb.setPointerCapture&&bb.setPointerCapture(e.pointerId);e.preventDefault()});
['pointerup','pointercancel','lostpointercapture'].forEach(ev=>bb.addEventListener(ev,()=>{touchLift=false}));
addEventListener('keydown',e=>{
  if(e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW'){kb.lift=true;e.preventDefault()}
  if((e.code==='KeyB'||e.code==='ArrowRight'||e.code==='KeyD'||e.code==='Enter')&&!e.repeat){if(S.state==='play'||S.state==='ready')shootReq=true;e.preventDefault()}
  if((e.code==='KeyP'||e.code==='Escape')&&!e.repeat){S.state==='paused'?resumeGame():pauseGame()}
});
addEventListener('keyup',e=>{if(e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW')kb.lift=false});
document.addEventListener('visibilitychange',()=>{if(document.hidden)pauseGame()});
addEventListener('resize',resize);addEventListener('orientationchange',()=>setTimeout(resize,200));
/* ---------- bucle ---------- */
let lastT=performance.now();
function loop(t){const dt=Math.min(0.05,(t-lastT)/1000);lastT=t;try{update(dt);draw()}catch(e){console.error(e)}requestAnimationFrame(loop)}
resize();fillHow();reset();S.state='menu';$('#hud').classList.remove('show');$('#blowB').classList.remove('show');$('#shootB').classList.remove('show');
requestAnimationFrame(loop);

</script>
</body>
</html>
